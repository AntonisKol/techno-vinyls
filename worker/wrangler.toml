# Cloudflare Worker for the hosted Techno Vinyls app. Deploy with `npm run deploy:worker`;
# set the token once with `npx wrangler secret put DISCOGS_TOKEN --config worker/wrangler.toml`.
name = "techno-vinyls-proxy"
main = "proxy.mjs"
compatibility_date = "2026-10-01"
workers_dev = false

[[routes]]
pattern = "api.adnsaudio.com"
custom_domain = true
