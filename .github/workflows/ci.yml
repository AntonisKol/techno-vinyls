# Checks every pull request and push to main: the tests, the type check and
# the build. After a push to main passes, it publishes the build to
# adnsaudio.com: the same as `npm run publish:site`, into the website
# repository (AntonisKol/adns-audio, served by GitHub Pages from its main).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The checks need no secrets and write nothing here; the deploy job writes
# only to the website repository, with its own deploy key.
permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A newer push to the same branch or pull request replaces the older run.
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true

    steps:
      # Actions are pinned to exact commits, so their code cannot change under
      # us; Dependabot (.github/dependabot.yml) proposes updates as pull requests.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run the tests
        env:
          CI: "true"
        run: npm test -- --watchAll=false --runInBand

      - name: Test the publish script
        run: npm run test:scripts

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          CI: "true"
        run: npm run build

  deploy:
    name: deploy to adnsaudio.com
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Deploys run one at a time, in order, and are never cut off halfway.
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - name: Check for the deploy key
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          if [ -z "$SITE_DEPLOY_KEY" ]; then
            echo "::error::No SITE_DEPLOY_KEY secret: see 'CI and deploys' in the README."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AntonisKol/adns-audio
          path: site
          # Full history, so the push can rebase onto newer website commits.
          fetch-depth: 0
          # A deploy key with write access to the website repository only.
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and copy into the website
        run: npm run publish:site -- site

      - name: Push the website
        working-directory: site
        env:
          COMMIT: ${{ github.sha }}
        run: |
          git add -A techno-vinyls
          if git diff --cached --quiet; then
            echo "The website already has this build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Techno Vinyls: publish AntonisKol/techno-vinyls@${COMMIT::7}"
          # The website may have moved on while this ran.
          git pull --rebase origin main
          git push origin HEAD:main
